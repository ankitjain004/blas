<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Reset password | BuildLikeASenior</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <style>
    :root{--ink:#101c2c;--navy:#0b1729;--teal:#087f72;--teal-bright:#00b894;--paper:#f7f5ef;--muted:#637083;--line:#dce1e6;--shadow:0 18px 50px rgba(16,28,44,.12)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);background:var(--paper);font-family:"DM Sans",sans-serif;padding:24px}button{font:inherit;border:0;cursor:pointer}h1{font-family:"Manrope",sans-serif;margin:0 0 6px;font-size:26px}
    .card{width:min(420px,100%);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:32px}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;font:800 17px "Manrope",sans-serif}.brand-mark{width:32px;height:32px;display:grid;place-items:center;background:var(--teal-bright);color:var(--navy)}
    p.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
    .field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}.field input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);background:#fafbfc;font-size:14px}.field input:focus{outline:2px solid var(--teal-bright);border-color:transparent}
    .button{width:100%;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--teal-bright);color:var(--navy);font-weight:800}.button:hover{background:#18caa7}
    .msg{padding:11px 13px;font-size:13px;margin-bottom:14px;display:none}.msg.show{display:block}.msg.err{background:#fdecec;color:#b3261e}.msg.ok{background:#e4f7f0;color:var(--teal)}
    .home{margin:16px 0 0;text-align:center;font-size:13px}.home a{color:var(--teal);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="brand-mark">B</span>BuildLikeASenior</div>
    <h1>Set a new password</h1>
    <p class="sub" id="sub">Choose a new password for your account.</p>
    <div class="msg" id="msg"></div>
    <form id="form">
      <div class="field"><label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password" minlength="6" required></div>
      <div class="field"><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" minlength="6" required></div>
      <button class="button" id="submit" type="submit" disabled>Update password</button>
    </form>
    <p class="home"><a href="index.html">← Back to BuildLikeASenior</a></p>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded",()=>{
      const msg=document.getElementById("msg"),form=document.getElementById("form"),submit=document.getElementById("submit"),sub=document.getElementById("sub");
      const show=(t,cls)=>{msg.textContent=t;msg.className="msg show "+cls};
      let sbClient=null,ready=false;
      fetch("/api/config").then(r=>r.json()).then(cfg=>{
        if(!cfg.authEnabled||!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){show("Password reset is not available right now.","err");return}
        sbClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
        sbClient.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"||session){ready=true;submit.disabled=false}});
        sbClient.auth.getSession().then(({data})=>{if(data.session){ready=true;submit.disabled=false}else{setTimeout(()=>{if(!ready){show("This reset link is invalid or has expired. Request a new one from the sign-in screen.","err")}},2500)}});
      }).catch(()=>show("Could not reach the server. Please refresh.","err"));
      form.addEventListener("submit",async e=>{
        e.preventDefault();
        if(!sbClient||!ready){show("Reset session not ready. Open the link from your email again.","err");return}
        const pw=document.getElementById("pw").value,pw2=document.getElementById("pw2").value;
        if(pw!==pw2){show("Passwords do not match.","err");return}
        submit.disabled=true;
        try{const{error}=await sbClient.auth.updateUser({password:pw});if(error)throw error;form.style.display="none";sub.textContent="";show("Password updated. You can now sign in with your new password.","ok");}
        catch(err){show(err.message||"Could not update password.","err");submit.disabled=false}
      });
      lucide.createIcons();
    });
  </script>
</body>
</html>
